name: QQQ 10am flatten (15:55 ET)

on:
  schedule:
    # 15:55 ET is 19:55 UTC in summer and 20:55 UTC in winter; the script ignores the other one.
    - cron: "55 19 * * 1-5"
    - cron: "55 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Close an open 10am trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tenam.py --flatten --scheduled
          else
            python tenam.py --flatten
          fi

      - name: Save journal, lessons, state and log
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add -A -- trades_state.json trade_journal.md lessons.md bot.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "10am flatten $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git pull --rebase
            git push
          fi
