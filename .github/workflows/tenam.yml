name: QQQ 10am model

on:
  schedule:
    # UTC times; GitHub ignores daylight saving and can start late. tenam.py --scheduled only
    # acts on the first start between 9:40 and 10:30 ET (9:50 ET in both seasons, 10:05 backup).
    - cron: "50 13 * * 1-5"
    - cron: "05 14 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "05 15 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual runs are dry runs (no orders); live trading only runs on the schedule"
        type: choice
        options: [dry-run]
        default: dry-run

concurrency:
  group: trading  # shared with the other trading workflows: one at a time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run 10am model
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tenam.py --scheduled
          else
            python tenam.py --dry-run
          fi

      - name: Save journal, lessons, state and log
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          for f in trades_state.json trade_journal.md lessons.md bot.log; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "10am run $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git pull --rebase
            git push
          fi
