name: Intraday flatten (15:55 ET)

on:
  schedule:
    # GitHub often starts scheduled jobs 30-50 minutes late, so this starts around 15:00 and
    # 15:30 ET (19:xx UTC in summer, 20:xx UTC in winter) and the script waits for 15:55 itself.
    # Starts outside 14:45-15:58 ET, and days with no open intraday trade, exit within seconds.
    - cron: "0 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 80  # a 14:45 start waits up to 70 minutes for 15:55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Close open intraday trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python intraday.py --flatten --scheduled
          else
            python intraday.py --flatten
          fi

      - name: Save journal, lessons, state and log
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          for f in trades_state.json trade_journal.md lessons.md bot.log; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Intraday flatten $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git pull --rebase
            git push
          fi
