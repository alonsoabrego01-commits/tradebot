name: Intraday models (QQQ inverse FVG, SPY liquidity sweep)

on:
  schedule:
    # UTC times; GitHub ignores daylight saving and often starts jobs up to an hour late, so
    # these aim at 8:20 and 8:50 ET in both seasons, with later backups. intraday.py --scheduled
    # only acts on the first start between 8:40 and 10:30 ET, waits for 9:35 itself, and reads
    # the opening bars from market data, so a late start still sees the whole morning.
    - cron: "20 12 * * 1-5"
    - cron: "50 12 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "50 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual runs are dry runs (no orders); live trading only runs on the schedule"
        type: choice
        options: [dry-run]
        default: dry-run

concurrency:
  group: trading  # shared with the other trading workflows: one at a time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # stays while a trade is open; the script stops itself after 5h35m (GitHub's limit is 6h)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Backup for the daily crossover: when GitHub starts the crossover's own job late, or cancels
      # it while it waits behind this one, it runs here. bot.py --scheduled still runs only once
      # per day between 9:30 and 12:00 ET, so on most days these steps exit in a second.
      - name: Daily crossover, if this job started late and it hasn't run yet today
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py --scheduled

      - name: Run intraday models
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python intraday.py --scheduled
          else
            python intraday.py --dry-run
          fi

      - name: Daily crossover, if it hasn't run yet today
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py --scheduled

      - name: Save journal, lessons, state and log
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          for f in trades_state.json trade_journal.md lessons.md bot.log; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Intraday run $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git pull --rebase
            git push
          fi
